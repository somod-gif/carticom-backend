spring:
  application:
    name: carticom-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carticom}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: "0"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:${PORT:8080}}
  forward-headers-strategy: framework

jwt:
  # REQUIRED. Base64-encoded HMAC-SHA signing key (must decode to >= 32 bytes).
  # There is deliberately NO default: a hardcoded fallback would be public in this
  # repository and would let anyone forge access tokens. Set JWT_SECRET in the
  # deployment environment (generate with: openssl rand -base64 48).
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

byteship:
  api-key: ${BYTESHIP_API_KEY:}
  base-url: https://api.byteship.dev

sendbyte:
  api-key: ${SENDBYTE_API_KEY:}
  base-url: ${SENDBYTE_API_URL:https://api.sendbyte.africa/v1}
  from-email: ${SENDBYTE_FROM_EMAIL:Carticom <orders@carticom.cv>}

cencori:
  api-key: ${CENCORI_API_KEY:}
  model: ${CENCORI_MODEL:groq/compound-mini}
  base-url: https://api.cencori.com/v1

seeder:
  enabled: ${SEED_DEMO_DATA:false}

app:
  base-url: ${APP_BASE_URL:https://carticom.cv}

# Public web origins allowed to call this API from a browser.
# Comma-separated. The built-in list below covers the production domain and the
# Vercel deployment URL; add preview URLs here (or via CORS_ALLOWED_ORIGINS)
# instead of editing CorsConfig.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

admin:
  email: ${ADMIN_EMAIL:admin@carticom.cv}
  # No default on purpose. When ADMIN_PASSWORD is blank the demo seeder skips
  # creating the admin account instead of falling back to a public password.
  password: ${ADMIN_PASSWORD:}

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:}
  base-url: https://api.paystack.co

flutterwave:
  secret-key: ${FLUTTERWAVE_SECRET_KEY:}
  base-url: https://api.flutterwave.com/v3

nomba:
  client-id: ${NOMBA_CLIENT_ID:}
  client-secret: ${NOMBA_CLIENT_SECRET:}
  account-id: ${NOMBA_ACCOUNT_ID:}
  base-url: ${NOMBA_BASE_URL:https://sandbox.nomba.com/v1}
  webhook-signature-key: ${NOMBA_WEBHOOK_SIGNATURE_KEY:}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:hello@carticom.dev}

# API rate limiting (com.carticom.ratelimit). Every tier is a token bucket:
# capacity = burst allowance, refill-tokens delivered every refill-minutes
# (refill-minutes: 1 makes refill-tokens a plain "per minute" rate).
# Retune a deployment with the RATELIMIT_* variables below - no code change.
ratelimit:
  enabled: ${RATELIMIT_ENABLED:true}
  # Upper bound on tracked buckets; least recently used are evicted past this.
  max-entries: ${RATELIMIT_MAX_ENTRIES:50000}
  # Buckets untouched for this long are dropped by the scheduled cleanup.
  bucket-idle-seconds: ${RATELIMIT_BUCKET_IDLE_SECONDS:600}
  tiers:
    # Credential endpoints (login, register, password reset, invite accept) - per IP.
    auth:
      capacity: ${RATELIMIT_AUTH_CAPACITY:10}
      refill-tokens: ${RATELIMIT_AUTH_REFILL_TOKENS:10}
      refill-minutes: ${RATELIMIT_AUTH_REFILL_MINUTES:1}
    # Image / store logo+banner uploads - per user.
    upload:
      capacity: ${RATELIMIT_UPLOAD_CAPACITY:30}
      refill-tokens: ${RATELIMIT_UPLOAD_REFILL_TOKENS:30}
      refill-minutes: ${RATELIMIT_UPLOAD_REFILL_MINUTES:1}
    # AI endpoints - 20 requests, one token every ~72 minutes (about 20/day).
    ai:
      capacity: ${RATELIMIT_AI_CAPACITY:20}
      refill-tokens: ${RATELIMIT_AI_REFILL_TOKENS:1}
      refill-minutes: ${RATELIMIT_AI_REFILL_MINUTES:72}
    # Public storefront / buyer / cart browsing - per IP.
    public:
      capacity: ${RATELIMIT_PUBLIC_CAPACITY:300}
      refill-tokens: ${RATELIMIT_PUBLIC_REFILL_TOKENS:300}
      refill-minutes: ${RATELIMIT_PUBLIC_REFILL_MINUTES:1}
    # Any other POST/PUT/PATCH/DELETE - per user.
    write:
      capacity: ${RATELIMIT_WRITE_CAPACITY:60}
      refill-tokens: ${RATELIMIT_WRITE_REFILL_TOKENS:60}
      refill-minutes: ${RATELIMIT_WRITE_REFILL_MINUTES:1}
    # Fallback for every other request.
    default:
      capacity: ${RATELIMIT_DEFAULT_CAPACITY:600}
      refill-tokens: ${RATELIMIT_DEFAULT_REFILL_TOKENS:600}
      refill-minutes: ${RATELIMIT_DEFAULT_REFILL_MINUTES:1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
