spring:
  application:
    name: carticom-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carticom}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: "0"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:${PORT:8080}}
  forward-headers-strategy: framework

jwt:
  # REQUIRED. Base64-encoded HMAC-SHA signing key (must decode to >= 32 bytes).
  # There is deliberately NO default: a hardcoded fallback would be public in this
  # repository and would let anyone forge access tokens. Set JWT_SECRET in the
  # deployment environment (generate with: openssl rand -base64 48).
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

byteship:
  api-key: ${BYTESHIP_API_KEY:}
  base-url: https://api.byteship.dev

sendbyte:
  api-key: ${SENDBYTE_API_KEY:}
  base-url: ${SENDBYTE_API_URL:https://api.sendbyte.africa/v1}
  from-email: ${SENDBYTE_FROM_EMAIL:Carticom <orders@carticom.cv>}

cencori:
  api-key: ${CENCORI_API_KEY:}
  model: ${CENCORI_MODEL:groq/compound-mini}
  base-url: https://api.cencori.com/v1

seeder:
  enabled: ${SEED_DEMO_DATA:false}

app:
  base-url: ${APP_BASE_URL:https://carticom.cv}

# Public web origins allowed to call this API from a browser.
# Comma-separated. The built-in list below covers the production domain and the
# Vercel deployment URL; add preview URLs here (or via CORS_ALLOWED_ORIGINS)
# instead of editing CorsConfig.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

admin:
  email: ${ADMIN_EMAIL:admin@carticom.cv}
  # No default on purpose. When ADMIN_PASSWORD is blank the demo seeder skips
  # creating the admin account instead of falling back to a public password.
  password: ${ADMIN_PASSWORD:}

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:}
  base-url: https://api.paystack.co

flutterwave:
  secret-key: ${FLUTTERWAVE_SECRET_KEY:}
  base-url: https://api.flutterwave.com/v3

nomba:
  client-id: ${NOMBA_CLIENT_ID:}
  client-secret: ${NOMBA_CLIENT_SECRET:}
  account-id: ${NOMBA_ACCOUNT_ID:}
  base-url: ${NOMBA_BASE_URL:https://sandbox.nomba.com/v1}
  webhook-signature-key: ${NOMBA_WEBHOOK_SIGNATURE_KEY:}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:hello@carticom.dev}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
